<body>
<x-dc>
<helmet><style>body{margin:0;background:#fff}*{box-sizing:border-box}button,input,select{font:inherit}button{cursor:pointer}input{accent-color:#3964fe}@supports (corner-shape: superellipse(1.5)){*,*::before,*::after{corner-shape:superellipse(1.5)}[style*="border-radius: 999px"],[style*="border-radius: 50%"],.btw-switch,.btw-switch::before{corner-shape:round}}</style></helmet>
<div style="min-height: 1080px; background: #fff; color: #17191e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; flex-wrap: wrap">
  <aside style="width: 929px; flex: 0 0 220px; padding: 24px 16px; background: #f3f4f6; border-right: 1px solid #e3e5e9; display: flex; flex-direction: column; gap: 20px"><div style="display: flex; align-items: center; gap: 10px; padding: 3px 6px; font-size: 15px; font-weight: 700"><span style="width: 28px; height: 28px; border-radius: 9px; background: #3964fe; color: #fff; display: grid; place-items: center; font-size: 15px">D</span>DeepSeek Harness</div><button style="height: 44px; border: 1px solid #d9dce2; border-radius: 10px; background: #fff; color: #292d35; text-align: left; padding: 0 12px">＋　新建会话</button><div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #555c68"><div style="padding: 12px 10px; border-radius: 8px; background: #e7e9ee; color: #202630; font-weight: 650">插件</div><div style="padding: 12px 10px">自动化任务</div><div style="padding: 12px 10px">更多</div></div><div style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: #646c79">工作区</div><div style="padding: 11px 10px; font-size: 13px; color: #4d5563">⌄　当前项目</div><div style="padding: 12px 10px 12px 27px; font-size: 13px; color: #606975">当前会话</div></aside>
  <main style="flex: 999 1 700px; min-width: 0; background: #fff; display: flex; flex-direction: column"><header style="height: 64px; padding: 0 34px; border-bottom: 1px solid #e9eaed; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #606975"><span>插件</span><span>/</span><span style="font-weight: 650; color: #252c36">btw</span></header>
    <div style="width: 100%; max-width: 900px; margin: 0 auto; padding: 32px 36px 50px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px"><div style="display: flex; gap: 14px"><div style="width: 48px; height: 48px; border-radius: 13px; background: #eef2ff; display: grid; place-items: center; color: #315cef; font-size: 14px; font-weight: 750">btw</div><div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 20px; line-height: 26px">btw</h1><div style="font-size: 13px; line-height: 20px; color: #5c6573">侧问与临时聊天，独立于主会话。</div></div></div><span style="font-size: 12px; color: #526070; padding-top: 8px">插件设置</span></div>
      <section style="border: 1px solid #dfe2e8; border-radius: 12px; background: #fff; overflow: hidden"><div style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 650">默认行为</h2><span style="font-size: 13px; line-height: 20px; color: #5c6573">沿用当前默认行为；需要时在聊天框里调整。</span></div><span style="color: #5c6573">⌃</span></div><div style="margin: 0 16px; border-top: 1px solid #e5e7eb; padding-bottom: 8px; display: flex; flex-direction: column">
        <div style="padding: 12px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 300px; min-width: 0"><span style="font-size: 14px; font-weight: 650">侧问上下文</span><span style="font-size: 13px; line-height: 20px; color: #5c6573">最近对话取文本快照；按需加载由 Agent 查找相关内容。</span></div><div style="display: flex; flex: 0 1 300px; max-width: 100%; flex-wrap: wrap; padding: 3px; border-radius: 20px; background: #f0f1f4; gap: 3px"><button style="flex: 1 1 auto; min-height: 32px; padding: 0 10px; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); color: #222b3b; font-size: 13px; font-weight: 650">最近对话</button><button style="flex: 1 1 auto; min-height: 32px; padding: 0 10px; border: 0; border-radius: 16px; background: transparent; color: #5c6573; font-size: 13px">仅当前问题</button><button style="flex: 1 1 auto; min-height: 32px; padding: 0 10px; border: 0; border-radius: 16px; background: transparent; color: #5c6573; font-size: 13px">按需加载</button></div></div>
        <div style="padding: 12px 0; border-top: 1px solid #eceef1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 300px; min-width: 0"><span style="font-size: 14px; font-weight: 650">临时聊天上下文</span><span style="font-size: 13px; line-height: 20px; color: #5c6573">第一条消息前可选择继承最近对话，默认不继承。</span></div><div style="display: flex; flex: 0 1 300px; max-width: 100%; flex-wrap: wrap; padding: 3px; border-radius: 20px; background: #f0f1f4; gap: 3px"><button style="flex: 1 1 auto; min-height: 32px; padding: 0 10px; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); color: #222b3b; font-size: 13px; font-weight: 650">不继承</button><button style="flex: 1 1 auto; min-height: 32px; padding: 0 10px; border: 0; border-radius: 16px; background: transparent; color: #5c6573; font-size: 13px">最近对话</button></div></div>
        <div style="padding: 12px 0; border-top: 1px solid #eceef1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; position: relative"><div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 300px"><label for="side-model" style="font-size: 14px; font-weight: 650">侧问默认模型</label><span style="font-size: 13px; line-height: 20px; color: #5c6573">保存为侧问的默认选择，不影响主会话；提问时可调整。</span></div><select id="side-model" style="flex: 0 1 300px; width: 300px; min-width: 0; max-width: 100%; height: 40px; padding: 0 12px; border: 1px solid #d9dce2; border-radius: 8px; background: #fff; color: #292d35; font-size: 13px"><option selected="">宿主默认</option><option>跟随当前会话</option><option>自行选择模型…</option></select><div style="font-size: 16px; line-height: 1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; position: absolute; left: 605px; top: 35px">这里怎么打不开！！<br><br></div></div>
        <div style="padding: 12px 0; border-top: 1px solid #eceef1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 300px"><label for="temporary-model" style="font-size: 14px; font-weight: 650">临时聊天默认模型</label><span style="font-size: 13px; line-height: 20px; color: #5c6573">保存为新临时聊天的默认选择；聊天框内可调整。</span></div><select id="temporary-model" style="flex: 0 1 300px; width: 300px; min-width: 0; max-width: 100%; height: 40px; padding: 0 12px; border: 1px solid #d9dce2; border-radius: 8px; background: #fff; color: #292d35; font-size: 13px"><option selected="">宿主默认</option><option>跟随当前会话</option><option>自行选择模型…</option></select></div>
      </div></section>
      <section style="border: 1px solid #dfe2e8; border-radius: 12px; background: #fff; overflow: hidden"><div style="padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 650">显示与入口</h2><span style="font-size: 13px; line-height: 20px; color: #5c6573">只控制入口或快捷方式，不改变既有会话。</span></div><span style="color: #5c6573">⌃</span></div><div style="margin: 0 16px; border-top: 1px solid #e5e7eb; padding-bottom: 8px">
        <label style="min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px"><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 650">显示侧问按钮</span><span style="font-size: 13px; color: #5c6573">在主输入框旁显示 btw；关闭后仍可使用 /btw。</span></span><input type="checkbox" checked="" style="width: 18px; height: 18px"></label>
        <label style="min-height: 62px; border-top: 1px solid #eceef1; display: flex; align-items: center; justify-content: space-between; gap: 12px"><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 650">启用 /btw 快捷输入</span><span style="font-size: 13px; color: #5c6573">在主输入框识别 /btw 并打开侧问。</span></span><input type="checkbox" checked="" style="width: 18px; height: 18px"></label>
        <label style="min-height: 62px; border-top: 1px solid #eceef1; display: flex; align-items: center; justify-content: space-between; gap: 12px"><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 650">显示临时聊天入口</span><span style="font-size: 13px; color: #5c6573">在会话标题右侧显示入口。</span></span><input type="checkbox" checked="" style="width: 18px; height: 18px"></label>
      </div></section>
    </div>
  </main>
</div>
