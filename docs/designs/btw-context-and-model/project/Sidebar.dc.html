<helmet><style>body{margin:0;background:#f5f6f8}*{box-sizing:border-box}button,input,textarea{font:inherit}button{cursor:pointer}input{accent-color:#3964fe}.btw-switch{appearance:none;position:relative;width:36px;height:20px;flex:0 0 36px;margin:0;border:0;border-radius:999px;background:#c6cbd2;cursor:pointer}.btw-switch::before{content:"";display:block;position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}.btw-switch:checked{background:#0f1115}.btw-switch:checked::before{transform:translateX(16px)}.btw-switch:disabled{opacity:.5}.btw-switch:focus-visible{outline:2px solid #4176e6;outline-offset:2px}@supports (corner-shape: superellipse(1.5)){*,*::before,*::after{corner-shape:superellipse(1.5)}[style*="border-radius: 999px"],[style*="border-radius: 50%"],.btw-switch,.btw-switch::before{corner-shape:round}}</style></helmet>
<div style="min-height: 940px; background: #f5f6f8; color: #17191e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; flex-wrap: wrap">
  <aside style="width: 200px; flex: 0 0 200px; padding: 24px 14px; background: #f3f4f6; border-right: 1px solid #e3e5e9; display: flex; flex-direction: column; gap: 20px"><div style="display: flex; align-items: center; gap: 10px; padding: 3px 6px; font-size: 14px; font-weight: 700"><span style="width: 28px; height: 28px; border-radius: 9px; background: #3964fe; color: #fff; display: grid; place-items: center; font-size: 15px">D</span>DeepSeek Harness</div><button style="height: 44px; border: 1px solid #d9dce2; border-radius: 10px; background: #fff; color: #292d35; text-align: left; padding: 0 12px">＋　新建会话</button><div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #555c68"><div style="padding: 12px 10px">插件</div><div style="padding: 12px 10px">自动化任务</div><div style="padding: 12px 10px">更多</div></div><div style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: #646c79">工作区</div><div style="padding: 11px 10px; font-size: 13px; color: #4d5563">⌄　当前项目</div><div style="padding: 12px 10px 12px 27px; border-radius: 8px; background: #e7e9ee; font-size: 13px; font-weight: 600">当前会话</div></aside>
  <main style="flex: 999 1 540px; min-width: 0; background: #fff; display: flex; flex-direction: column"><header style="height: 64px; padding: 0 28px; border-bottom: 1px solid #e9eaed; display: flex; align-items: center; justify-content: space-between"><div style="display: flex; gap: 10px; align-items: center"><span style="font-size: 14px; font-weight: 650">当前会话</span><span style="font-size: 12px; color: #606975">/　当前项目</span></div><button style="height: 40px; padding: 0 12px; background: #f7f8fa; border: 1px solid #e4e7eb; border-radius: 9px; color: #3d4654; font-size: 12px">临时聊天</button></header>
    <div style="flex: 1; padding: 36px 28px 22px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 16px"><div style="width: 100%; max-width: 600px; padding: 18px; border: 1px solid #edf0f3; border-radius: 12px; background: #fafbfc; color: #5c6471; font-size: 13px; line-height: 1.7">主会话保持可见。侧边栏中的内容只有在主动送回并发送后才进入主会话。</div><div style="width: 100%; max-width: 600px; min-height: 155px; border: 1px solid #dfe2e8; border-radius: 14px; padding: 15px; display: flex; flex-direction: column; gap: 14px; color: #687180"><div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid #dce5ff; border-radius: 9px; background: #f5f7ff; color: #344b89; font-size: 12px; line-height: 18px"><span style="font-weight: 650">来自侧边栏对话 · 2 条已选内容</span><span>已插入主会话草稿，可编辑后发送</span></div><span style="font-size: 13px">输入补充说明…</span><div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 12px">＋　访问模式</span><div style="display: flex; gap: 10px; align-items: center"><span style="font-size: 12px">当前会话模型</span><button aria-label="发送主会话消息" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: #315cef; color: #fff; font-size: 18px">↑</button></div></div></div></div>

    <header style="height: 64px; padding: 0 14px; border-bottom: 1px solid #e9eaed; display: flex; align-items: center; justify-content: space-between; gap: 8px"><div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 14px; font-weight: 700">btw</span><span style="font-size: 12px; color: #667180">· 当前会话</span></div><div style="display: flex; align-items: center; gap: 4px"><button style="height: 38px; border: 0; background: transparent; color: #526071; font-size: 12px">弹窗</button><button style="height: 38px; border: 0; background: transparent; color: #8a3841; font-size: 12px">结束</button><button aria-label="收起侧边栏（保留对话）" style="width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: #526071; font-size: 18px">×</button></div></header>
    <div style="padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f8f9fb; border-bottom: 1px solid #edf0f3"><span style="font-size: 12px; color: #596576">不继承主会话 · 当前项目</span><button style="min-height: 36px; border: 0; background: transparent; color: #315cef; font-size: 12px">完成多选</button></div>
    <div style="flex: 1; padding: 22px 16px; display: flex; flex-direction: column; gap: 14px"><div style="align-self: flex-end; max-width: 84%; padding: 10px 12px; border-radius: 12px 12px 4px 12px; background: #315cef; color: #fff; font-size: 13px; line-height: 20px">先帮我梳理一下项目结构。</div>
      <label style="display: flex; align-items: flex-start; gap: 9px"><input type="checkbox" checked style="margin-top: 13px"><span style="flex: 1; display: flex; flex-direction: column; gap: 7px; padding: 11px 12px; border: 1px solid #b8c9ff; border-radius: 10px; background: #f6f8ff; color: #303d53; font-size: 13px; line-height: 20px"><span style="font-weight: 650; color: #30498a">示例回答 · 1</span><span>这里展示对话中可选择的第一段内容。</span></span></label>
      <label style="display: flex; align-items: flex-start; gap: 9px"><input type="checkbox" checked style="margin-top: 13px"><span style="flex: 1; display: flex; flex-direction: column; gap: 7px; padding: 11px 12px; border: 1px solid #b8c9ff; border-radius: 10px; background: #f6f8ff; color: #303d53; font-size: 13px; line-height: 20px"><span style="font-weight: 650; color: #30498a">示例回答 · 2</span><span>也可以选择另一条消息，一起送回主会话。</span></span></label>
      <div style="align-self: flex-end; width: 220px; padding: 6px; border: 1px solid #dfe3e9; border-radius: 10px; background: #fff; box-shadow: 0 8px 24px rgba(23,31,52,.12); display: flex; flex-direction: column"><div style="padding: 6px 10px; color: #667180; font-size: 11px">右键菜单</div><button style="min-height: 38px; text-align: left; border: 0; border-radius: 6px; background: #eef2ff; color: #284ec5; padding: 0 10px; font-size: 12px">送回主会话草稿　2 条</button><button style="min-height: 38px; text-align: left; border: 0; border-radius: 6px; background: transparent; color: #4d5968; padding: 0 10px; font-size: 12px">复制所选内容</button></div>
      <div style="font-size: 11px; line-height: 18px; color: #616b79">多选消息后，右键或点击下方按钮；内容先进入草稿，不会自动发送。</div>
    </div>
    <div style="border-top: 1px solid #e9eaed; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-size: 12px; color: #566273">已选择 2 条</span><button style="min-height: 40px; padding: 0 13px; border: 1px solid #cad6ff; border-radius: 9px; background: #f5f7ff; color: #284ec5; font-size: 12px; font-weight: 650">送回主会话草稿</button></div><div style="border: 0; border-radius: 28px; padding: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 1px rgba(15,17,21,.08), 0 2px 8px rgba(15,17,21,.08)"><textarea aria-label="侧边栏对话消息" placeholder="继续对话…" style="min-height: 50px; width: 100%; resize: vertical; border: 0; outline: none; padding: 4px; color: #262a31; font-size: 13px; line-height: 20px"></textarea><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 5px"><span style="flex: 1"></span><button style="min-height: 36px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #434c5a; font-size: 11px">宿主默认模型　⌄</button><label style="min-height: 36px; display: flex; align-items: center; gap: 5px; padding: 0 8px; color: #4a5564; font-size: 11px"><input class="btw-switch" type="checkbox" disabled>继承上下文</label><button aria-label="发送侧边栏对话消息" style="width: 38px; height: 38px; border: 0; border-radius: 9px; background: #315cef; color: #fff; font-size: 18px">↑</button></div></div><span style="font-size: 11px; line-height: 17px; color: #616b79">收起保留对话；结束时清理。继承设置在首条消息后锁定。</span></div>
