<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>全局临时聊天 · 概念示意</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:#f5f6f8}*{box-sizing:border-box}button,input,textarea{font:inherit}button{cursor:pointer}.btw-switch{appearance:none;position:relative;width:36px;height:20px;flex:0 0 36px;margin:0;border:0;border-radius:999px;background:#c6cbd2}.btw-switch::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}.btw-switch:checked{background:#0f1115}.btw-switch:checked::before{transform:translateX(16px)}.btw-switch:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #4176e6;outline-offset:2px}@supports (corner-shape: superellipse(1.5)){*,*::before,*::after{corner-shape:superellipse(1.5)}[style*="border-radius: 999px"],.btw-switch,.btw-switch::before{corner-shape:round}}</style></helmet>
<div style="min-height: 940px; background: #f5f6f8; color: #17191e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; flex-wrap: wrap">
  <aside style="width: 220px; flex: 0 0 220px; padding: 24px 16px; background: #f3f4f6; border-right: 1px solid #e3e5e9; display: flex; flex-direction: column; gap: 20px">
    <div style="padding: 7px 6px; font-size: 15px; font-weight: 700">DeepSeek Harness</div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <button type="button" style="height: 44px; border: 1px solid #d9dce2; border-radius: 10px; background: #fff; color: #292d35; text-align: left; padding: 0 12px">＋　新建会话</button>
      <button type="button" style="height: 44px; border: 0; border-radius: 10px; background: #e7e9ee; color: #20242b; text-align: left; padding: 0 12px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: -3px; margin-right: 12px"><circle cx="8" cy="8" r="5.5"></circle><path d="M8 4.5V8l2.2 1.4"></path></svg>临时聊天</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #555c68"><div style="padding: 12px 10px">插件</div><div style="padding: 12px 10px">自动化任务</div><div style="padding: 12px 10px">更多</div></div>
    <div style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: #646c79">工作区</div>
  </aside>
  <main style="flex: 999 1 700px; min-width: 0; min-height: 940px; display: flex; flex-direction: column; background: #fff">
    <header style="min-height: 64px; padding: 10px 34px; border-bottom: 1px solid #e9eaed; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 14px; font-weight: 650">新建会话</span><span style="font-size: 12px; color: #606975">全局 · 无需工作区</span></div>
      <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 4px; font-size: 13px; font-weight: 600; color: #292d35"><span>临时聊天</span><input class="btw-switch" type="checkbox" checked="" aria-label="临时聊天模式"></label>
    </header>
    <div style="flex: 1; padding: 36px 28px 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
      <div style="width: 100%; max-width: 740px; text-align: center; display: flex; flex-direction: column; gap: 10px"><h1 style="margin: 0; font-size: 24px; line-height: 34px; font-weight: 700">开始一段临时聊天</h1><p style="margin: 0; font-size: 14px; line-height: 22px; color: #5b6471">无需工作区，直接开始对话。</p><p style="margin: 0; font-size: 13px; line-height: 20px; color: #5b6471">退出临时聊天后清理</p></div>
      <section aria-label="临时聊天输入框" style="width: 100%; max-width: 740px; padding: 16px; border-radius: 28px; background: #f1f2f4; box-shadow: 0 0 0 1px rgba(15,17,21,.06); display: flex; flex-direction: column; gap: 12px">
        <textarea aria-label="临时聊天消息" placeholder="问点什么…" style="width: 100%; min-height: 84px; padding: 4px; border: 0; resize: vertical; background: transparent; color: #262a31; font-size: 14px; line-height: 22px"></textarea>
        <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px"><button type="button" style="min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #434c5a; font-size: 12px">宿主默认模型　⌄</button><label style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 9px; color: #434c5a; font-size: 12px"><input class="btw-switch" type="checkbox" disabled title="没有来源会话">继承上下文</label><button type="button" aria-label="发送临时聊天消息" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #315cef; color: #fff; font-size: 18px">↑</button></div>
      </section>
    </div>
  </main>
</div>
</x-dc>

</html>
